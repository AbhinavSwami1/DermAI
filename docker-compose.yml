# Usage: cp .env.example .env  (edit secrets), then: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dermai}
      POSTGRES_USER: ${POSTGRES_USER:-dermai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: DermAI
      APP_VERSION: 1.0.0
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dermai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dermai}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: http://localhost:8080
      DERMAI_MODEL_CHECKPOINT: /app/ml/checkpoints/mobilenet/best_mobilenet_v3_large_finetuned.pth
      REFRESH_COOKIE_SECURE: "false"
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/app/backend/storage
      - ./ml/checkpoints:/app/ml/checkpoints:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
